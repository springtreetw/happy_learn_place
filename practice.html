<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#eaf2ef">
  <title>練習園地｜學習樂園</title>
  <style>
    :root{--ink:#263b3d;--muted:#617577;--paper:#edf4f0;--card:#fffefa;--line:#cbdad5;--teal:#397c78;--teal-dark:#285e5b;--sun:#f3c56b;--shadow:0 14px 34px #31524b18}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:ui-rounded,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background-color:var(--paper);background-image:radial-gradient(#c8d9d2 1px,transparent 1px);background-size:19px 19px}a{color:inherit}.shell{max-width:1080px;margin:auto;padding:24px 28px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}.brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);font-weight:850;text-decoration:none}.brand-mark{width:40px;height:40px;border-radius:14px;background:#fff3d9;display:grid;place-items:center;font-size:23px}.wallet{padding:9px 14px;border:1px solid var(--line);border-radius:14px;background:#fffefa;color:var(--muted);font-size:13px}.wallet strong{color:#8a6418;font-size:20px}.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 240px;align-items:center;gap:25px;padding:clamp(24px,5vw,45px);border:1px solid #bdd1ca;border-radius:28px;background:linear-gradient(125deg,#dcebe5,#f8fbf5 70%);box-shadow:var(--shadow);overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 39px,#8ab3a51a 40px);pointer-events:none}.hero-copy,.buddy{position:relative;z-index:1}.eyebrow{margin:0 0 7px;color:var(--teal);font-size:12px;font-weight:900;letter-spacing:.16em}.hero h1{margin:0;font-size:clamp(42px,7vw,68px);line-height:1.08;letter-spacing:-.04em}.hero-copy>p:not(.eyebrow){max-width:550px;margin:14px 0 0;color:var(--muted);font-size:16px;line-height:1.8}.buddy{justify-self:center;width:220px;height:220px;border-radius:50%;display:grid;place-items:center;background:#fffefa;border:9px solid #ffffffa8;box-shadow:0 10px 24px #34524a1c}.buddy img{width:90%;height:90%;object-fit:contain}.buddy-name{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);padding:7px 12px;border:1px solid #bdd1ca;border-radius:99px;background:#fffefa;color:var(--teal-dark);font-size:12px;font-weight:850;white-space:nowrap}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:34px 0 15px}.section-head h2{margin:0;font-size:24px}.section-head p{margin:0;color:var(--muted);font-size:13px}.practice-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:15px}.practice-card{position:relative;min-height:182px;display:grid;grid-template-columns:58px minmax(0,1fr) 22px;align-items:start;gap:16px;padding:22px;border:1px solid var(--line);border-radius:21px;background:var(--card);box-shadow:0 6px 18px #31524b0d;text-decoration:none;transition:transform .18s,box-shadow .18s,border-color .18s}.practice-card:hover{transform:translateY(-4px);border-color:#80aaa0;box-shadow:var(--shadow)}.practice-icon{width:56px;height:56px;display:grid;place-items:center;border-radius:17px;background:#e1f0ec;font-size:29px}.practice-card:nth-child(2n) .practice-icon{background:#fff0cf}.practice-card:nth-child(3n) .practice-icon{background:#e9e5f5}.practice-copy{min-width:0}.category{display:inline-flex;margin:0 0 8px;padding:4px 9px;border-radius:99px;background:#eaf3f0;color:var(--teal-dark);font-size:11px;font-weight:850}.practice-card h3{margin:0 0 7px;font-size:19px;line-height:1.35}.practice-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}.arrow{color:var(--teal);font-size:22px;font-weight:900}.practice-card:focus-visible,.brand:focus-visible{outline:3px solid #397c7870;outline-offset:4px}.test-badge{margin-left:8px;color:#987018;font-size:11px;font-weight:800}.footer-note{margin-top:22px;color:var(--muted);font-size:12px;line-height:1.7;text-align:center}@media(max-width:650px){.shell{padding:17px 15px 40px}.topbar{margin-bottom:22px}.hero{grid-template-columns:minmax(0,1fr) 120px;gap:10px;padding:22px 18px;border-radius:22px}.hero h1{font-size:clamp(37px,9vw,52px)}.hero-copy>p:not(.eyebrow){font-size:14px;line-height:1.65}.buddy{width:116px;height:116px;border-width:5px}.buddy-name{bottom:-4px;font-size:10px;padding:5px 8px}.section-head{align-items:start;flex-direction:column;gap:4px;margin-top:25px}.section-head h2{font-size:21px}.practice-list{gap:11px}.practice-card{min-height:145px;padding:17px;grid-template-columns:48px minmax(0,1fr) 17px;gap:12px}.practice-icon{width:46px;height:46px;border-radius:14px;font-size:24px}.practice-card h3{font-size:17px}}@media(max-width:390px){.hero{grid-template-columns:1fr}.buddy{width:145px;height:145px;justify-self:end;margin:4px 6px 3px 0}.hero h1{font-size:42px}.wallet{padding:8px 10px}.wallet span{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">🎡</span><span>學習樂園</span></a><div class="wallet" aria-live="polite"><span>目前金幣　</span><strong id="coins">0</strong> 🪙 <span id="testModeTools" hidden><b class="test-badge">測試模式</b></span></div></header>
    <section class="hero"><div class="hero-copy"><p class="eyebrow">YOUR PRACTICE STUDIO</p><h1>練習園地</h1><p>挑一個喜歡的練習開始吧。每完成一題，都能累積金幣，讓收藏夥伴越來越多。</p></div><div class="buddy" aria-label="目前展示的夥伴"><img id="practiceDisplayImage" src="assets/shiba/shiba_01.png" alt="目前展示的柴柴"><span class="buddy-name" id="practiceDisplayName">原型 · 01</span></div></section>
    <section aria-labelledby="practiceHeading"><div class="section-head"><h2 id="practiceHeading">選擇一項練習</h2><p>練習項目會持續增加，歡迎常來看看。</p></div><nav class="practice-list" id="practiceList" aria-label="可選擇的練習"></nav></section>
    <p class="footer-note">你的展示夥伴和金幣會與首頁、轉蛋商店及收藏圖鑑同步。</p>
  </main>
  <script src="app-config.js"></script><script src="rarity.js"></script><script src="gacha-core.js"></script><script src="app.js"></script><script src="practice-menu.js"></script>
</body>
</html>
