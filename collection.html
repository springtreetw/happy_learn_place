  <style>

    .demo-footer{margin-top:24px;padding:13px 15px;background:#f0ece3;border-radius:13px;color:#77766f;font-size:12px;line-height:1.65}.demo-footer b{color:#67645b}.overlay{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:22px;background:#1d201bb3;backdrop-filter:blur(5px)}.overlay.open{display:flex}.modal{position:relative;width:min(800px,100%);max-height:min(700px,94vh);overflow:auto;display:grid;grid-template-columns:1fr 1fr;background:#fffefa;border-radius:25px;box-shadow:0 30px 100px #0005}.modal-art{min-height:380px;background:#f1e8dc;display:grid;place-items:center}.modal-art img{width:100%;height:100%;max-height:520px;object-fit:contain}.modal-content{padding:40px 34px;display:flex;flex-direction:column;justify-content:center}.close{position:absolute;right:14px;top:14px;border:0;background:#f3f0e9;width:36px;height:36px;border-radius:50%;font-size:21px}.modal-content h2{margin:0 0 7px;font-size:30px}.modal-content p{color:var(--muted);line-height:1.7;font-size:14px}.modal-status{font-size:12px;color:var(--muted);margin:10px 0 22px}.modal-status.is-current{display:inline-flex;align-items:center;align-self:flex-start;margin:10px 0 22px;padding:9px 12px;border-radius:99px;background:#ffe2cd;color:#a94e20;font-size:13px;font-weight:900;box-shadow:inset 0 0 0 1px #f4ad7e}.modal-status.is-current::before{content:"★";margin-right:7px}.modal-actions{display:grid;gap:9px}.primary{background:var(--orange);color:white;border:0;border-radius:13px;padding:13px;font-weight:800}.primary:hover{background:var(--orange-dark)}.secondary{background:white;border:1px solid var(--line);border-radius:13px;padding:12px;font-weight:700}.modal-actions .secondary{transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease,color .18s ease}.modal-actions .secondary:not(:disabled):hover{background:#fff4e9;border-color:#e3a276;color:var(--orange-dark);transform:translateY(-2px);box-shadow:0 9px 20px #9e5d322     @media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{grid-template-columns:1fr}.progress-card{max-width:300px}.display-panel{min-height:260px;padding:24px 28px}.display-avatar{width:190px;height:190px}}
    @media(max-width:540px){.shell{padding:18px 15px 40px}.topbar{margin-bottom:32px}.top-note{font-size:10px}.hero h1{font-size:34px}.display-panel{padding:18px 16px 62px;gap:12px;min-height:215px;margin-top:20px}.display-avatar{width:145px;height:145px}.display-copy h2{font-size:20px}.display-copy p{font-size:11px}.display-actions{position:absolute;right:14px;bottom:13px}.display-actions .soft-button{padding:9px 12px;font-size:12px}.display-panel:after{right:-60px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.locked-art{min-width:78px;min-height:78px;font-size:clamp(112px,30vw,142px)}.card-footer{padding:10px}.card-title{font-size:13px}.toolbar{gap:6px;flex-wrap:wrap}.filter{padding:8px 11px}.toolbar-spacer{display:none}.search{margin-left:auto}.modal{grid-template-columns:1fr;max-width:430px}.modal-art{min-height:0;aspect-ratio:1.08}.modal-art img{max-height:330px}.modal-content{padding:22px 24px 25px}.modal-content h2{font-size:25px}}
    .card-sub{font-weight:750;letter-spacing:.02em}.card-sub.rarity-common{color:#7a7e85}.card-sub.rarity-rare{color:#47805e}.card-sub.rarity-epic{color:#8050a7}.card-sub.rarity-legendary{color:#a77a19}.modal-content h2.rarity-common{color:#7a7e85}.modal-content h2.rarity-rare{color:#47805e}.modal-content h2.rarity-epic{color:#8050a7}.modal-content h2.rarity-legendary{color:#a77a19}
    .shop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;margin:25px 0 30px;padding:24px 28px;border:1px solid #eadbca;border-radius:24px;background:linear-gradient(115deg,#fff9f1,#f4eee4);box-shadow:var(--shadow)}.shop h2{margin:0 0 7px;font-size:25px}.shop p{margin:0;color:var(--muted);line-height:1.65}.shop-balance{text-align:right}.shop-balance strong{display:block;font-size:24px}.shop-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:11px}.draw-result{display:none;align-items:center;gap:14px;margin-top:17px;padding:12px 14px;background:#ffffffb8;border:1px solid var(--line);border-radius:16px}.draw-result.show{display:flex;animation:reveal .48s cubic-bezier(.2,.8,.2,1) both}.draw-result img{width:76px;height:76px;object-fit:contain;border-radius:50%;background:#f1e8dc}.draw-result strong{display:block}.draw-result span{display:block;margin-top:4px;color:var(--muted);font-size:13px}.draw-result.rarity-rare{border-color:#8db89a}.draw-result.rarity-epic{border-color:#ba91d6}.draw-result.rarity-legendary{border-color:#d6b55b}.draw-result.gacha-spin{border-color:#ef8c55;background:#fff4e9}.draw-result.gacha-spin img{animation:capsule-shake .14s infinite alternate}.primary:disabled{opacity:.55;cursor:wait}.shop-error{color:#a63d2f!important;font-size:13px;margin-top:8px!important}@keyframes capsule-shake{from{transform:rotate(-8deg) translateX(-3px)}to{transform:rotate(8deg) translateX(3px)}}@keyframes reveal{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}

<body>
  <main class="shell">
    <header class="topbar collection-topbar"><a class="brand" href="index.html" aria-label="回到學習樂園首頁"><span class="brand-mark" aria-hidden="true">🎡</span><span>學習樂園</span></a><nav class="page-nav" aria-label="主要導覽"><a class="nav-link" href="practice.html">練習園地</a><a class="nav-link" href="gacha-menu.html">轉蛋選擇</a><a class="nav-link active" href="collection-menu.html" aria-current="page">圖鑑選擇</a></nav><div id="testModeTools" hidden><b>測試模式</b></div></header>
    <section class="hero"><div><p class="eyebrow">SHIBA COLLECTION</p><h1>柴柴圖鑑</h1><p>每一隻柴柴都有自己的造型。慢慢收集，打造你的專屬展示夥伴。</p></div><div class="progress-card"><div class="progress-line"><strong id="count">0 / 32</strong><span id="percent">完成 0%</span></div><div class="track"><i id="progress" style="width:0%"></i></div></div></section>
    <section class="display-panel"><div class="display-avatar"><img id="displayImage" src="assets/shiba/shiba_01.png" alt="目前展示的柴犬"></div><div class="display-copy"><p class="eyebrow" id="displayStatus">目前展示</p><h2 id="displayName">造型 01</h2><p>選一隻喜歡的柴柴，讓牠陪著你。</p></div><div class="display-actions"><button class="soft-button" id="chooseDisplay">從圖鑑挑選　↗</button></div></section>
    <nav class="toolbar" aria-label="圖鑑篩選"><button class="filter active" data-filter="all">全部 32</button><button class="filter" data-filter="collected">已收藏 <span id="filterCount">0</span></button><span class="toolbar-spacer"></span><input id="search" class="search" type="search" placeholder="搜尋造型編號" aria-label="搜尋造型"></nav>
    <section class="grid" id="grid" aria-live="polite"></section>
    <aside class="demo-footer">圖鑑與轉蛋商店共用收藏與金幣，資料會自動儲存在此瀏覽器。造型 01 是贈送的原型。</aside>
  </main>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><article class="modal"><button class="close" id="closeModal" aria-label="關閉">×</button><div class="modal-art"><img id="modalImage" alt=""></div><div class="modal-content"><p class="eyebrow">SHIBA · COLLECTION</p><h2 id="modalTitle">原型</h2><div class="modal-actions"><button class="secondary" id="displayButton">設為展示柴柴</button></div></div></article></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app-config.js"></script>
  <script src="rarity.js"></script>
  <script src="gacha-core.js"></script>
  <script src="app.js"></script>
</body>
